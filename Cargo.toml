[workspace]
resolver = "3"
members = [
    "crates/peervps-core",
    "crates/peervps-cli",
    "apps/desktop/src-tauri",
]
default-members = ["crates/peervps-core", "crates/peervps-cli"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/evrenbetimen/peer-vps"

[workspace.lints.rust]
# Memory-safety policy: no `unsafe` anywhere unless a module opts in explicitly
# with `#[allow(unsafe_code)]` and documents every block with a `// SAFETY:` note.
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
peervps-core = { path = "crates/peervps-core" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
kvm-bindings = "0.14"
kvm-ioctls = "0.25"
nix = { version = "0.31", features = ["sched", "signal"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = { version = "0.10", features = ["risky-raw-split"] }
socket2 = { version = "0.6", features = ["all"] }
subtle = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system", "network", "component"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tun = { version = "0.8", features = ["async"] }
uuid = { version = "1", features = ["v4", "serde"] }
vm-memory = { version = "0.16", features = ["backend-mmap"] }
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
