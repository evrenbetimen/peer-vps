name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # QC gate: every check below must pass on both Linux and macOS before merge.
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
          - os: macos-15
            browser: webkit # same engine as the WKWebView Tauri uses on macOS
          - os: windows-2025
            browser: chromium # WebView2 is Chromium
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system libraries + QEMU
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev qemu-system-x86 qemu-utils
      # The QEMU backend's lifecycle test runs a real (blank-disk, software-emulated) VM where QEMU exists.
      - name: QEMU
        if: runner.os == 'macOS'
        run: brew install qemu

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck + bundle; also produces apps/desktop/dist, which the Tauri crate embeds at compile time.
      - run: pnpm build
      - name: UI unit tests + coverage thresholds
        run: pnpm test:coverage
      - name: UI end-to-end QA (${{ matrix.browser }})
        run: |
          pnpm --filter @peervps/desktop exec playwright install --with-deps ${{ matrix.browser }}
          pnpm test:e2e --project ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report-${{ matrix.os }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
            apps/desktop/coverage/
          if-no-files-found: ignore

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Unsigned macOS app (Apple silicon) for manual QA; download it from the run's artifacts.
  macos-app:
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm tauri build --bundles app,dmg
      - name: Smoke-test the bundled app
        run: |
          app=target/release/bundle/macos/PeerVPS.app
          bin=$(find "$app/Contents/MacOS" -type f -perm -u+x | head -1)
          test -n "$bin"
          plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist"
          lipo -archs "$bin"
          # Launch it and make sure node setup (SQLite, provisioner, pumps) does not crash.
          "$bin" > app.log 2>&1 &
          pid=$!
          sleep 10
          kill -0 "$pid" || { cat app.log; exit 1; }
          kill "$pid"
          cat app.log
      - uses: actions/upload-artifact@v4
        with:
          name: PeerVPS-macos-arm64
          path: target/release/bundle/dmg/*.dmg

  # Unsigned Windows installer (x64) for manual QA; download it from the run's artifacts.
  windows-app:
    needs: check
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm tauri build --bundles nsis
      - name: Smoke-test the app
        shell: pwsh
        run: |
          $exe = "target/release/peervps-desktop.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem target/release; throw "app binary missing" }
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object { $_.Name }
          # Launch it and make sure node setup (SQLite, provisioner, pumps) does not crash.
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardError app.log
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Get-Content app.log; throw "app exited with $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          Get-Content app.log
      - uses: actions/upload-artifact@v4
        with:
          name: PeerVPS-windows-x64
          path: target/release/bundle/nsis/*.exe
